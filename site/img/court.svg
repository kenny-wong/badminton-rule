<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1360 630" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5">
  <!-- A doubles badminton court to scale (13.4 m × 6.1 m, 1 unit = 1 cm), used as faint line art. -->
  <rect x="0" y="0" width="1340" height="610"/>
  <!-- Singles sidelines -->
  <line x1="0" y1="46" x2="1340" y2="46"/>
  <line x1="0" y1="564" x2="1340" y2="564"/>
  <!-- Doubles long service lines -->
  <line x1="76" y1="0" x2="76" y2="610"/>
  <line x1="1264" y1="0" x2="1264" y2="610"/>
  <!-- Short service lines, 1.98 m from the net -->
  <line x1="472" y1="0" x2="472" y2="610"/>
  <line x1="868" y1="0" x2="868" y2="610"/>
  <!-- Centre lines -->
  <line x1="0" y1="305" x2="472" y2="305"/>
  <line x1="868" y1="305" x2="1340" y2="305"/>
  <!-- Net -->
  <line x1="670" y1="-10" x2="670" y2="620" stroke-opacity="0.26" stroke-width="7" stroke-dasharray="14 8"/>
</svg>
